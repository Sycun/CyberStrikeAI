name: Task management UI
on:
  push:
    paths: ['web/templates/index.html', 'web/static/js/tasks.js', 'web/static/js/router.js', 'web/static/js/auth.js', 'web/static/js/modal.js', 'web/static/js/rbac-guards.js', 'web/static/css/**', 'web/static/i18n/**', 'scripts/batch-tasks-browser.test.cjs', 'scripts/helpers/batch-task-ui-fixture.cjs', '.github/workflows/task-ui.yml']
  pull_request:
    paths: ['web/templates/index.html', 'web/static/js/tasks.js', 'web/static/js/router.js', 'web/static/js/auth.js', 'web/static/js/modal.js', 'web/static/js/rbac-guards.js', 'web/static/css/**', 'web/static/i18n/**', 'scripts/batch-tasks-browser.test.cjs', 'scripts/helpers/batch-task-ui-fixture.cjs', '.github/workflows/task-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/task-ui-deps" --no-save --ignore-scripts --package-lock=false playwright@1.65.0
          "$RUNNER_TEMP/task-ui-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test real task page entrypoints and controls
        run: |
          NODE_PATH="$RUNNER_TEMP/task-ui-deps/node_modules" node --test scripts/batch-tasks-browser.test.cjs
